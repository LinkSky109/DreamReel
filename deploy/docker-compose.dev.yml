# 本地/开发环境：web + api + postgres；可选基础设施按需启用
#   docker compose -f deploy/docker-compose.dev.yml up --build
#   docker compose -f deploy/docker-compose.dev.yml --profile infra up -d redis minio
#
# 小说域固定 PostgreSQL 单源，api 依赖 postgres 健康后启动；
# 容器入口会先执行迁移（AUTO_MIGRATE=false 可关闭）。
services:
  # Docker Desktop 在某些配置下会把宿主 bind mount 以只读（virtiofs ro）提供，
  # 直接挂 ../storage 会让 API 无法写入并导致 /health/ready 503。
  # 这里先用只读 seed 初始化 named volume，再让 API 挂载可写卷。
  storage-init:
    image: alpine:3.20
    volumes:
      - ../storage:/seed:ro
      - dreamreel-storage:/data
    command:
      - sh
      - -c
      - |
        if [ ! -f /data/.dreamreel-initialized ]; then
          cp -a /seed/. /data/ 2>/dev/null || true
          chown -R 1000:1000 /data
          touch /data/.dreamreel-initialized
        fi
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    # 本地密钥（JWT_SECRET 等）来自仓库根 .env；不存在时保持可启动但会在
    # production 模式下由 authService 明确报错，避免静默使用弱密钥。
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      SERVE_STATIC: "false"
      PORT: "3000"
      STORAGE_PATH: /app/storage
      DATABASE_URL: ${DATABASE_URL:-postgres://dreamreel:dreamreel@postgres:5432/dreamreel}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-false}
      AUTO_MIGRATE: "true"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - dreamreel-storage:/app/storage
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dreamreel
      POSTGRES_PASSWORD: dreamreel
      POSTGRES_DB: dreamreel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamreel -d dreamreel"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 仅容器网络内使用，避免与宿主机已有 PostgreSQL（或其它 compose）抢占 5432。
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    profiles: ["infra"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: dreamreel
      MINIO_ROOT_PASSWORD: dreamreel123
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  dreamreel-storage:
  pgdata:
  redisdata:
  miniodata:
