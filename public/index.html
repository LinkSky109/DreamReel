<!DOCTYPE html>

        </a>
        <a href="#/project/new" class="sidebar-link" data-route="project/new">

        </a>
        <a href="#/gallery" class="sidebar-link" data-route="gallery">

          <span>作品广场</span>
        </a>
        <a href="#/templates" class="sidebar-link" data-route="templates">

        </a>
        <a href="#/challenges" class="sidebar-link" data-route="challenges">
          <span class="sidebar-icon">🏆</span>
          <span>创作挑战</span>
        </a>
      </div>

      <div class="sidebar-divider"></div>

      <div class="sidebar-group">
        <a href="#/directors" class="sidebar-link" data-route="directors">

          <span>导演模式</span>
        </a>
        <a href="#/title-sequences" class="sidebar-link" data-route="title-sequences">

        </a>
        <a href="#/studios" class="sidebar-link" data-route="studios">
          <span class="sidebar-icon">🎭</span>
          <span>剧场计划</span>
        </a>
      </div>

      <div class="sidebar-divider"></div>

      <div class="sidebar-group-title">更多</div>
      <div class="sidebar-group">
        <a href="#/store" class="sidebar-link" data-route="store">

        </a>
        <a href="#/teams" class="sidebar-link" data-route="teams">

          <span>团队协作</span>
        </a>
        <a href="#/enterprise" class="sidebar-link" data-route="enterprise">

        <a href="#/api-console" class="sidebar-link" data-route="api-console">

  <!-- 移动端侧边栏遮罩 -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- 顶部轻量 Header -->
  <header class="app-header" id="appHeader">
    <button class="sidebar-toggle" id="sidebarToggle" title="展开/收起导航">
      ☰
    </button>
    <div class="header-right">
      <div class="quota-badge" id="quotaBadge" title="今日剩余视频生成额度">
        <span class="quota-icon">🎬</span>
        <span id="quotaText">--/--</span>
      </div>
      <div class="user-info" id="userInfo" style="display: none;">
        <span class="user-avatar">👤</span>
        <span class="user-name"></span>
        <a href="#/stats" class="upgrade-link" title="创作数据">📊</a>
        <a href="#/pricing" class="upgrade-link" title="升级订阅">升级</a>
        <a href="#/logout" class="logout-link" title="退出登录">退出</a>
      </div>
      <a href="#/pricing" class="btn btn-sm btn-primary" id="upgradeBtn" style="display: none;">升级 Pro</a>
      <a href="#/login" class="btn btn-sm" id="loginBtn">登录</a>
      <div class="notification-wrapper">
        <button class="btn btn-sm notification-bell" id="notificationBell" title="通知">
          🔔
          <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
        </button>
        <div class="notification-panel" id="notificationPanel" style="display: none;">
          <div class="notification-panel-header">
            <span>通知</span>
            <div class="notification-header-actions">
              <button class="btn btn-sm btn-link" id="markAllReadBtn">全部已读</button>
              <button class="btn btn-sm btn-link btn-danger" id="clearNotificationsBtn" title="清空所有通知">清空</button>
            </div>
          </div>
          <div class="notification-filter" id="notificationFilter">
            <button class="notification-filter-btn active" data-filter="all">全部</button>
            <button class="notification-filter-btn" data-filter="unread">未读</button>
            <button class="notification-filter-btn" data-filter="video">视频</button>
            <button class="notification-filter-btn" data-filter="comment">评论</button>
            <button class="notification-filter-btn" data-filter="system">系统</button>
          </div>
          <div class="notification-list" id="notificationList">
            <div class="notification-empty">暂无通知</div>
          </div>
        </div>
      </div>
      <button class="btn btn-sm theme-toggle" id="themeToggleBtn" title="切换主题">☀️</button>
      <button class="btn btn-sm lang-toggle" id="langToggleBtn" title="切换语言">🌐 中</button>
    </div>
  </header>

  <main class="app-main" id="app">
    <!-- 动态渲染 -->
  </main>

  <!-- 移动端底部导航 -->
  <nav class="mobile-tabbar" id="mobileTabbar">
    <a href="#/" data-route=""><span class="mt-icon">🏠</span>首页</a>
    <a href="#/gallery" data-route="gallery"><span class="mt-icon">🎬</span>广场</a>
    <a href="#/challenges" data-route="challenges"><span class="mt-icon">🏆</span>挑战</a>
    <a href="#/templates" data-route="templates"><span class="mt-icon">🎨</span>模板</a>
    <a href="#/settings" data-route="settings"><span class="mt-icon">⚙️</span>设置</a>
  </nav>

  <div class="toast-container" id="toastContainer"></div>

  <div class="keyboard-hint" id="keyboardHint" title="点击查看快捷键">
    ⌨️ 按 <kbd>?</kbd> 查看快捷键
  </div>

  <script type="module" src="/js/i18n.js"></script>
  <script type="module" src="/js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {})
      })
    }
    let deferredPrompt = null
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault()
      deferredPrompt = e
      const existing = document.querySelector('.pwa-install-banner')
      if (existing) return
      const banner = document.createElement('div')
      banner.className = 'pwa-install-banner'
      banner.innerHTML = '<span>📱 将 DreamReel 添加到主屏幕，随时创作</span><button id="pwaInstallBtn">安装</button><button id="pwaDismiss" style="background:transparent;color:#fff;">✕</button>'
      document.body.appendChild(banner)
      banner.querySelector('#pwaInstallBtn').addEventListener('click', async () => {
        if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null }
        banner.remove()
      })
      banner.querySelector('#pwaDismiss').addEventListener('click', () => banner.remove())
    })
  </script>
</body>
</html>
