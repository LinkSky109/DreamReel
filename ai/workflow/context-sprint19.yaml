acceptance:
  - "《殖装》前 100 章 → 产出完整角色表（主要角色齐全、别名归一到唯一实体）"
  - "每角色含 name/aliases/appearance/personality/voice/catchphrase/relations/abilities/growth"
  - "人工修订率 = 修订字段数 ÷ 自动产出字段总数（目标 < 30%，LLM 路径）"
  - "原文 + 切片 + 角色卡落盘、重启不丢；测试隔离"
  - "抓取不绕过反爬；TXT/逐章取不到走粘贴/上传，如实失败"

constraints:
  - "开发期最小成本；不引入新运行时依赖（用内置 fetch + 现有 provider）"
  - "LLM 质量需真实 key；mock 下走启发式并如实标注，不夸大达标"
  - "不绕过登录/验证码/加密；限速抓取"

risks:
  - "启发式无 LLM 时达不到修订率<30%（如实标注）"
  - "站点改版失效；TXT 水印与编码需处理"
  - "版权合规：用户明确接受（记为接受的合规风险）"

