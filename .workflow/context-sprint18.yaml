scope:
  - id: "T18-001"
    name: "FNV-1a 64-bit 稳定 ID 生成"
    owner: "backend"
    priority: "P0"
    status: "DEV_DONE"
    features:
      - "新增 src/utils/hash.js：fnv1a64 / fnv1a64Hex"
      - "新增 src/utils/idGenerator.js：generateId()（返回 16 位 hex）"
      - "project/shot/scene/character/Studio/Team/ImageAsset 等模型与服务由 uuid 切换到 generateId()"
    fixed_defect:
      severity: "P0（已修复 2026-10-12）"
      summary: "FNV-1a 用 BigInt 计算但未做 mod 2^64 回绕，乘积无界增长；高位字节不受低位输入影响，且 .toString(16).padStart(16) 失效"
      observed_before_fix:
        - "generateId() 实测返回长度 426（非 16），如 'cbf29d1c04c1830a...'"
        - "连续 6 次 generateId().slice(0,8) 全为 'cbf29d1c'（唯一值 1）"
      impact:
        - "src/services/templateService.js 的 `user-${generateId().slice(0,8)}` 恒定 → 用户模板 ID 碰撞 → 用例失败"
        - "src/models/ImageAsset.js 的 `img_${Date.now()}_${generateId().slice(0,8)}` 在同毫秒内碰撞"
        - "project.id / shot.id / scene.id 等为非预期的 426 字符长串（影响 URL、文件名、索引、可读性）"
      fix: "src/utils/hash.js 增加 FNV_64_MASK=0xffffffffffffffffn，乘法改为 (hash ^ byte) * PRIME & MASK"
      verified_after_fix:
        - "generateId() 长度 16；连续 6 次 slice(0,8) 唯一值 6"
        - "fnv1a64Hex('hello') = a430d84680aabd0b（标准 FNV-1a 64 值）"

