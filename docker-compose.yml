version: '3.8'

services:
  dreamreel:
    build: .
    container_name: dreamreel
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VIDEO_PROVIDER=mock
      - LLM_PROVIDER=mock
      - TTS_PROVIDER=mock
    volumes:
      - dreamreel-storage:/app/storage
    restart: unless-stopped

volumes:
  dreamreel-storage:
